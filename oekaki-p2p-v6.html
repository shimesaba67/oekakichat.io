<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>お絵描きP2P v3</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e4e4e4;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      user-select: none;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* Top bar */
    #topbar {
      display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
      padding: 7px 12px; background: #1c1c1c; border-bottom: 1px solid #333;
      z-index: 50;
    }
    #topbar label { opacity: 0.7; margin-right: 3px; font-size: 12px; }
    #my-id {
      font-family: ui-monospace, monospace; background: #0a0a0a;
      padding: 3px 8px; border-radius: 4px; color: #7dd3fc;
      user-select: all; font-size: 12px;
    }
    input[type="text"], input[type="number"] {
      background: #0a0a0a; border: 1px solid #444; color: #eee;
      padding: 4px 8px; border-radius: 4px; font-size: 12px;
    }
    input[type="number"] { width: 58px; }
    #name-input { width: 110px; }
    button {
      background: #2a5a9e; color: #fff; border: none;
      padding: 5px 11px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #234d87; }
    button.secondary { background: #333; }
    button.secondary:hover { background: #444; }
    button.danger { background: #7a2a2a; }
    button.active-tool { outline: 2px solid #7dd3fc; background: #1e3a5f; }
    #status { margin-left: auto; opacity: 0.65; font-size: 12px; }

    /* Main area */
    #workspace {
      flex: 1; position: relative; overflow: hidden; background: #111;
    }

    /* Floating panels */
    .panel {
      position: absolute; background: #1a1a1aee; border: 1px solid #3a3a3a;
      border-radius: 8px; box-shadow: 0 8px 24px #0008;
      display: flex; flex-direction: column; min-width: 160px;
      z-index: 20; backdrop-filter: blur(6px);
    }
    .panel-header {
      padding: 6px 10px; background: #252525; border-radius: 8px 8px 0 0;
      cursor: grab; font-size: 12px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #333;
    }
    .panel-header:active { cursor: grabbing; }
    .panel-body { padding: 8px; overflow: auto; flex: 1; }
    .panel h3 {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      opacity: 0.5; margin: 8px 0 4px;
    }
    .panel h3:first-child { margin-top: 0; }

    #tools-panel { top: 12px; left: 12px; width: 200px; max-height: calc(100% - 24px); }
    #layers-panel { top: 12px; left: 230px; width: 180px; }
    #chat-panel { top: 12px; right: 12px; width: 260px; height: 320px; }
    #view-panel { bottom: 12px; left: 12px; width: 220px; }

    .tool-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
    #color { width: 34px; height: 28px; border: none; background: none; cursor: pointer; padding: 0; }
    input[type="range"] { width: 100%; }

    #layer-list { display: flex; flex-direction: column; gap: 3px; max-height: 160px; overflow-y: auto; }
    .layer-item {
      display: flex; align-items: center; gap: 6px; padding: 4px 6px;
      background: #252525; border-radius: 4px; cursor: pointer; border: 1px solid transparent;
    }
    .layer-item.active { border-color: #7dd3fc; background: #1e3a5f; }
    .layer-item .vis { width: 18px; text-align: center; opacity: 0.7; font-size: 12px; }
    .layer-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #chat-log {
      flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px;
      font-size: 12px; min-height: 0;
    }
    .chat-msg { word-break: break-word; }
    .chat-msg .who { color: #7dd3fc; font-weight: 600; margin-right: 4px; }
    .chat-msg.system { opacity: 0.5; font-style: italic; }
    #chat-input-row { display: flex; gap: 4px; padding: 6px; border-top: 1px solid #333; }
    #chat-input { flex: 1; }

    /* Canvas viewport */
    #viewport {
      position: absolute; inset: 0; overflow: hidden; cursor: crosshair;
      touch-action: none;
    }
    #canvas-stage {
      position: absolute; left: 50%; top: 50%;
      transform-origin: center center;
      will-change: transform;
    }
    #display {
      display: block; background: #fff;
      box-shadow: 0 0 0 1px #444, 0 12px 40px #000a;
    }
    #region-overlay {
      position: absolute; pointer-events: none;
      border: 2px dashed #22c55e; display: none;
    }

    #hud {
      position: absolute; bottom: 10px; right: 14px;
      font-size: 11px; color: #666; pointer-events: none;
      text-align: right; line-height: 1.4;
    }

    /* HSV picker cursors handled inline */
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div>
      <label>名前</label>
      <input type="text" id="name-input" placeholder="名無しさん" maxlength="16">
    </div>
    <div>
      <label>ID</label>
      <span id="my-id">...</span>
    </div>
    <div>
      <input type="text" id="join-id" placeholder="相手の部屋ID（8文字）" style="text-transform:uppercase;">
      <button id="join-btn">参加</button>
    </div>
    <div>
      <label>W</label><input type="number" id="cw" value="1200" min="300" max="4000">
      <label>H</label><input type="number" id="ch" value="800" min="300" max="4000">
      <button id="apply-size" class="secondary">サイズ</button>
    </div>
    <div id="status">待機中</div>
  </div>

  <div id="workspace">
    <div id="viewport">
      <div id="canvas-stage">
        <canvas id="display"></canvas>
        <div id="region-overlay"></div>
      </div>
    </div>

    <!-- Tools Panel -->
    <div class="panel" id="tools-panel">
      <div class="panel-header">ツール</div>
      <div class="panel-body">
        <div class="tool-row">
          <button data-tool="pen" class="active-tool">ペン</button>
          <button data-tool="thick">厚塗り</button>
          <button data-tool="watercolor">水彩</button>
          <button data-tool="marker">マーカー</button>
          <button data-tool="eraser">消しゴム</button>
          <button data-tool="eyedropper">スポイト</button>
        </div>
        <h3>色</h3>
        <div id="hsv-picker" style="display:flex;gap:8px;align-items:flex-start;">
          <div style="position:relative;">
            <canvas id="sv-square" width="120" height="120" style="display:block;border-radius:4px;cursor:crosshair;"></canvas>
            <div id="sv-cursor" style="position:absolute;width:10px;height:10px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000;pointer-events:none;transform:translate(-50%,-50%);"></div>
          </div>
          <div style="position:relative;">
            <canvas id="hue-bar" width="18" height="120" style="display:block;border-radius:4px;cursor:ns-resize;"></canvas>
            <div id="hue-cursor" style="position:absolute;left:-2px;width:22px;height:4px;background:#fff;border:1px solid #000;pointer-events:none;transform:translateY(-50%);"></div>
          </div>
        </div>
        <div class="tool-row" style="justify-content:center;gap:8px;margin-top:6px;">
          <input type="color" id="color" value="#111111">
          <span id="color-hex">#111111</span>
        </div>
        <h3>サイズ <span id="size-val">5</span></h3>
        <input type="range" id="size" min="1" max="80" value="5">
        <h3>不透明度 <span id="opacity-val">100</span>%</h3>
        <input type="range" id="opacity" min="5" max="100" value="100">
        <label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;">
          <input type="checkbox" id="use-pressure" checked> 筆圧でサイズ変化
        </label>
        <h3>描画領域</h3>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;">
          <input type="checkbox" id="use-region"> 領域制限
        </label>
        <button id="set-region" class="secondary" style="width:100%;margin-top:4px;">領域を指定</button>
        <button id="clear-active" class="secondary" style="width:100%;margin-top:8px;">レイヤー消去</button>
        <h3>保存</h3>
        <div class="tool-row">
          <button id="save-png" class="secondary">PNG</button>
          <button id="save-jpg" class="secondary">JPEG</button>
        </div>
        <div style="font-size:11px;opacity:0.5;margin-top:10px;line-height:1.5;">
          キー: Bペン T厚塗り W水彩 Mマーカー E消し Iスポイト<br>
          [ ] サイズ ±　O 不透明度-　P 不透明度+<br>
          + - ズーム　R/F 回転　Space+ドラッグ パン
        </div>
      </div>
    </div>

    <!-- Layers Panel -->
    <div class="panel" id="layers-panel">
      <div class="panel-header">レイヤー</div>
      <div class="panel-body">
        <div id="layer-list"></div>
        <div class="tool-row" style="margin-top:8px;">
          <button id="add-layer" class="secondary">+ 追加</button>
          <button id="del-layer" class="danger">削除</button>
        </div>
      </div>
    </div>

    <!-- Chat Panel -->
    <div class="panel" id="chat-panel">
      <div class="panel-header">チャット</div>
      <div id="chat-log"></div>
      <div id="chat-input-row">
        <input type="text" id="chat-input" placeholder="メッセージ..." maxlength="300">
        <button id="chat-send">送信</button>
      </div>
    </div>

    <!-- View Panel -->
    <div class="panel" id="view-panel">
      <div class="panel-header">ビュー（自分だけ）</div>
      <div class="panel-body">
        <div class="tool-row">
          <button id="zoom-in" class="secondary">＋</button>
          <button id="zoom-out" class="secondary">－</button>
          <button id="rotate-ccw" class="secondary">↺</button>
          <button id="rotate-cw" class="secondary">↻</button>
          <button id="view-reset" class="secondary">リセット</button>
        </div>
        <div style="font-size:11px;opacity:0.55;margin-top:6px;line-height:1.4;">
          ホイール：ズーム<br>
          中ボタンドラッグ / Space+ドラッグ：パン<br>
          回転はボタン or Alt+ドラッグ
        </div>
      </div>
    </div>

    <div id="hud">
      <div id="hud-zoom">100%</div>
      <div id="hud-rot">0°</div>
    </div>
  </div>
</div>
<script>
// ===================== Core State =====================
const display = document.getElementById('display');
const dctx = display.getContext('2d');
const stage = document.getElementById('canvas-stage');
const viewport = document.getElementById('viewport');
const regionOverlay = document.getElementById('region-overlay');
const myIdEl = document.getElementById('my-id');
const statusEl = document.getElementById('status');
const chatLog = document.getElementById('chat-log');
const layerListEl = document.getElementById('layer-list');
const nameInput = document.getElementById('name-input');

let peer = null;
let connections = [];
let myPeerId = '';
let isHost = true; // 最初に開いた人がホスト。参加した側は false になる
let myName = '';
try { myName = localStorage.getItem('oekaki_name') || ''; } catch(e) {}

let W = 1200, H = 800;
let layers = [];
let activeLayerId = null;
let nextLayerId = 1;

let tool = 'pen';
let color = '#111111';
let baseSize = 5;
let opacity = 1.0; // 0.05 ~ 1.0
let usePressure = true;

let isDrawing = false;
let lastX = 0, lastY = 0;

let useRegion = false;
let region = null;
let settingRegion = false;
let regionStart = null;

// Local view transform (only affects this client)
let view = { x: 0, y: 0, scale: 1, rot: 0 }; // rot in radians
let isPanning = false;
let isRotating = false;
let panStart = null;
let spaceDown = false;

// ===================== Utils =====================
function setStatus(t) { statusEl.textContent = t; }
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function addChat(who, text, isSystem = false) {
  const div = document.createElement('div');
  div.className = 'chat-msg' + (isSystem ? ' system' : '');
  if (isSystem) div.textContent = text;
  else div.innerHTML = '<span class="who">' + escapeHtml(who) + '</span>' + escapeHtml(text);
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

// ===================== View Transform =====================
function applyView() {
  stage.style.transform = `translate(calc(-50% + ${view.x}px), calc(-50% + ${view.y}px)) rotate(${view.rot}rad) scale(${view.scale})`;
  document.getElementById('hud-zoom').textContent = Math.round(view.scale * 100) + '%';
  document.getElementById('hud-rot').textContent = Math.round(view.rot * 180 / Math.PI) + '°';
}

function screenToCanvas(clientX, clientY) {
  // viewport center is the transform origin
  const vrect = viewport.getBoundingClientRect();
  const cx = clientX - (vrect.left + vrect.width / 2);
  const cy = clientY - (vrect.top + vrect.height / 2);

  // 1. undo pan
  let x = cx - view.x;
  let y = cy - view.y;

  // 2. undo rotation
  const cos = Math.cos(-view.rot);
  const sin = Math.sin(-view.rot);
  const rx = x * cos - y * sin;
  const ry = x * sin + y * cos;

  // 3. undo scale
  x = rx / view.scale;
  y = ry / view.scale;

  // 4. from center-origin to canvas top-left origin
  // display is W x H and centered, so add half size
  return {
    x: x + W / 2,
    y: y + H / 2
  };
}

// ===================== Layers =====================
function createLayer(name) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const id = nextLayerId++;
  const layer = { id, name: name || ('レイヤー ' + id), visible: true, canvas: c, ctx };
  layers.push(layer);
  if (!activeLayerId) activeLayerId = id;
  return layer;
}
function getActiveLayer() { return layers.find(l => l.id === activeLayerId); }

function composite() {
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = '#ffffff';
  dctx.fillRect(0, 0, W, H);
  for (const l of layers) {
    if (!l.visible) continue;
    dctx.drawImage(l.canvas, 0, 0);
  }
  updateRegionOverlay();
}

function renderLayerList() {
  layerListEl.innerHTML = '';
  [...layers].reverse().forEach(l => {
    const item = document.createElement('div');
    item.className = 'layer-item' + (l.id === activeLayerId ? ' active' : '');
    item.innerHTML = '<span class="vis">' + (l.visible ? '👁' : '–') + '</span><span class="name">' + escapeHtml(l.name) + '</span>';
    item.onclick = (e) => {
      if (e.target.classList.contains('vis')) {
        l.visible = !l.visible;
        sendToAll({ type: 'layerVis', id: l.id, visible: l.visible });
        composite();
        renderLayerList();
      } else {
        activeLayerId = l.id;
        renderLayerList();
      }
    };
    layerListEl.appendChild(item);
  });
}

function initLayers() {
  layers = []; nextLayerId = 1;
  createLayer('背景');
  createLayer('レイヤー 1');
  activeLayerId = layers[1].id;
  layers[0].ctx.fillStyle = '#ffffff';
  layers[0].ctx.fillRect(0, 0, W, H);
  composite();
  renderLayerList();
}

// ===================== Drawing =====================
function inRegion(x, y) {
  if (!useRegion || !region) return true;
  return x >= region.x && x <= region.x + region.w && y >= region.y && y <= region.y + region.h;
}

function drawStroke(x0, y0, x1, y1, opts, doBroadcast = true) {
  const layer = layers.find(l => l.id === opts.layerId) || getActiveLayer();
  if (!layer) return;
  const ctx = layer.ctx;
  const alpha = (opts.opacity !== undefined ? opts.opacity : 1);
  let size = opts.size;

  ctx.save();

  // ペンと消しゴムは従来の線分で高速・シャープに
  if (opts.tool === 'pen' || opts.tool === 'eraser') {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (opts.tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#000';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = opts.color;
    }
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  } else {
    // 厚塗り・水彩・マーカーはスタンプ方式（丸の連なり感を減らす）
    const dx = x1 - x0;
    const dy = y1 - y0;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
    let step, stampAlpha, soft;

    if (opts.tool === 'watercolor') {
      // 広く・薄く・柔らかい。重ねると徐々に濃くなる
      size *= 2.4;
      step = Math.max(1.5, size * 0.18);
      stampAlpha = Math.min(0.14, alpha * 0.18);
      soft = true;
      ctx.globalCompositeOperation = 'source-over';
    } else if (opts.tool === 'thick') {
      // 狭く・濃く・しっかり置く。ほぼ不透明で積み重ねる
      size *= 1.25;
      step = Math.max(0.8, size * 0.32);
      stampAlpha = Math.min(0.92, alpha * 0.95);
      soft = false;
      ctx.globalCompositeOperation = 'source-over';
    } else { // marker
      size *= 1.7;
      step = Math.max(1.2, size * 0.24);
      stampAlpha = Math.min(0.35, alpha * 0.4);
      soft = true;
      ctx.globalCompositeOperation = 'source-over';
    }

    const steps = Math.max(1, Math.ceil(dist / step));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const x = x0 + dx * t;
      const y = y0 + dy * t;

      if (soft) {
        // 柔らかい円（グラデーション）
        const r = size / 2;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, opts.color);
        g.addColorStop(0.55, opts.color);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = stampAlpha;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 厚塗り：比較的シャープな円
        ctx.globalAlpha = stampAlpha;
        ctx.fillStyle = opts.color;
        ctx.beginPath();
        ctx.arc(x, y, size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  ctx.restore();
  composite();

  if (doBroadcast) {
    sendToAll({
      type: 'stroke', x0, y0, x1, y1,
      color: opts.color, size: opts.size, tool: opts.tool,
      layerId: layer.id, pressure: opts.pressure, opacity: opts.opacity
    });
  }
}

function clearLayer(layerId, doBroadcast = true) {
  const layer = layers.find(l => l.id === layerId);
  if (!layer) return;
  layer.ctx.clearRect(0, 0, W, H);
  if (layer.name === '背景') {
    layer.ctx.fillStyle = '#ffffff';
    layer.ctx.fillRect(0, 0, W, H);
  }
  composite();
  if (doBroadcast) sendToAll({ type: 'clearLayer', layerId });
}

function updateRegionOverlay() {
  if (!useRegion || !region) {
    regionOverlay.style.display = 'none';
    return;
  }
  regionOverlay.style.display = 'block';
  regionOverlay.style.left = region.x + 'px';
  regionOverlay.style.top = region.y + 'px';
  regionOverlay.style.width = region.w + 'px';
  regionOverlay.style.height = region.h + 'px';
}

// ===================== HSV Color Picker (クリスタ型) =====================
const svCanvas = document.getElementById('sv-square');
const svCtx = svCanvas.getContext('2d');
const hueCanvas = document.getElementById('hue-bar');
const hueCtx = hueCanvas.getContext('2d');
const svCursor = document.getElementById('sv-cursor');
const hueCursor = document.getElementById('hue-cursor');

let hsv = { h: 0, s: 0, v: 0.07 }; // 初期はほぼ黒

function hsvToRgb(h, s, v) {
  h = ((h % 360) + 360) % 360;
  const c = v * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; }
  else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; }
  else { r = c; b = x; }
  return {
    r: Math.round((r + m) * 255),
    g: Math.round((g + m) * 255),
    b: Math.round((b + m) * 255)
  };
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}
function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 0, g: 0, b: 0 };
}
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
    else if (max === g) h = ((b - r) / d + 2) * 60;
    else h = ((r - g) / d + 4) * 60;
  }
  const s = max === 0 ? 0 : d / max;
  return { h, s, v: max };
}

function drawHueBar() {
  const h = hueCanvas.height;
  for (let y = 0; y < h; y++) {
    const hue = (y / h) * 360;
    hueCtx.fillStyle = `hsl(${hue}, 100%, 50%)`;
    hueCtx.fillRect(0, y, hueCanvas.width, 2);
  }
}
function drawSVSquare() {
  const w = svCanvas.width, h = svCanvas.height;
  const img = svCtx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const s = x / (w - 1);
      const v = 1 - y / (h - 1);
      const rgb = hsvToRgb(hsv.h, s, v);
      const i = (y * w + x) * 4;
      img.data[i] = rgb.r;
      img.data[i + 1] = rgb.g;
      img.data[i + 2] = rgb.b;
      img.data[i + 3] = 255;
    }
  }
  svCtx.putImageData(img, 0, 0);
}
function updateCursors() {
  svCursor.style.left = (hsv.s * 120) + 'px';
  svCursor.style.top = ((1 - hsv.v) * 120) + 'px';
  hueCursor.style.top = ((hsv.h / 360) * 120) + 'px';
}
function applyHSV() {
  const rgb = hsvToRgb(hsv.h, hsv.s, hsv.v);
  const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
  color = hex;
  document.getElementById('color').value = hex;
  document.getElementById('color-hex').textContent = hex;
  updateCursors();
}
function setColorFromHex(hex) {
  const rgb = hexToRgb(hex);
  const converted = rgbToHsv(rgb.r, rgb.g, rgb.b);
  hsv = converted;
  drawSVSquare();
  applyHSV();
}

drawHueBar();
drawSVSquare();
updateCursors();
applyHSV();

// Hue bar interaction
hueCanvas.addEventListener('pointerdown', e => {
  hueCanvas.setPointerCapture(e.pointerId);
  pickHue(e);
});
hueCanvas.addEventListener('pointermove', e => { if (e.buttons) pickHue(e); });
function pickHue(e) {
  const rect = hueCanvas.getBoundingClientRect();
  let y = (e.clientY - rect.top) / rect.height;
  y = Math.max(0, Math.min(1, y));
  hsv.h = y * 360;
  drawSVSquare();
  applyHSV();
}

// SV square interaction
svCanvas.addEventListener('pointerdown', e => {
  svCanvas.setPointerCapture(e.pointerId);
  pickSV(e);
});
svCanvas.addEventListener('pointermove', e => { if (e.buttons) pickSV(e); });
function pickSV(e) {
  const rect = svCanvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) / rect.width;
  let y = (e.clientY - rect.top) / rect.height;
  x = Math.max(0, Math.min(1, x));
  y = Math.max(0, Math.min(1, y));
  hsv.s = x;
  hsv.v = 1 - y;
  applyHSV();
}

// native color input sync
document.getElementById('color').addEventListener('input', e => {
  setColorFromHex(e.target.value);
});

// ===================== Network =====================
function sendToAll(data) {
  connections.forEach(c => { if (c.open) c.send(data); });
}

function setupConnection(conn) {
  if (connections.find(c => c.peer === conn.peer)) return;
  connections.push(conn);
  conn.on('open', () => {
    setStatus('接続中 (' + connections.length + '人)');
    addChat('', (conn.peer.slice(0,6)) + ' が参加', true);
    conn.send({ type: 'hello', from: myPeerId, name: myName || '名無しさん', w: W, h: H });
  });
  conn.on('data', data => handleRemote(data));
  conn.on('close', () => {
    connections = connections.filter(c => c !== conn);
    setStatus(connections.length ? '接続中 (' + connections.length + '人)' : '待機中');
    addChat('', conn.peer.slice(0,6) + ' が退出', true);
  });
}

function handleRemote(data) {
  if (!data || !data.type) return;
  switch (data.type) {
    case 'stroke':
      drawStroke(data.x0, data.y0, data.x1, data.y1, {
        color: data.color, size: data.size, tool: data.tool,
        layerId: data.layerId, pressure: data.pressure, opacity: data.opacity
      }, false);
      break;
    case 'clearLayer':
      clearLayer(data.layerId, false);
      break;
    case 'addLayer':
      if (!layers.find(l => l.id === data.id)) {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        layers.push({ id: data.id, name: data.name, visible: true, canvas: c, ctx: c.getContext('2d') });
        nextLayerId = Math.max(nextLayerId, data.id + 1);
        renderLayerList(); composite();
      }
      break;
    case 'layerVis':
      const lv = layers.find(l => l.id === data.id);
      if (lv) { lv.visible = data.visible; renderLayerList(); composite(); }
      break;
    case 'chat':
      addChat(data.name || data.from || '??', data.text);
      break;
    case 'hello':
      addChat('', (data.name || '誰か') + ' が接続', true);
      if (data.w !== W || data.h !== H) {
        addChat('', `相手サイズ違い: ${data.w}x${data.h}`, true);
      }
      break;
    case 'size':
      if (data.w && data.h && (data.w !== W || data.h !== H)) {
        applySize(data.w, data.h, false);
        addChat('', `サイズ変更 → ${data.w}x${data.h}`, true);
      }
      break;
    case 'name':
      // future: presence list
      break;
  }
}

function applySize(w, h, doBroadcast = true) {
  W = Math.max(300, Math.min(4000, w|0));
  H = Math.max(300, Math.min(4000, h|0));
  display.width = W; display.height = H;
  layers.forEach(l => {
    const old = l.canvas;
    const nc = document.createElement('canvas');
    nc.width = W; nc.height = H;
    nc.getContext('2d').drawImage(old, 0, 0);
    l.canvas = nc; l.ctx = nc.getContext('2d');
  });
  region = null;
  composite();
  document.getElementById('cw').value = W;
  document.getElementById('ch').value = H;
  if (doBroadcast) sendToAll({ type: 'size', w: W, h: H });
}

// ===================== UI Events =====================
document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active-tool'));
    btn.classList.add('active-tool');
    tool = btn.dataset.tool;
    display.style.cursor = tool === 'eyedropper' ? 'copy' : 'crosshair';
  });
});

document.getElementById('color').addEventListener('input', e => {
  color = e.target.value;
  document.getElementById('color-hex').textContent = color;
});
document.getElementById('size').addEventListener('input', e => {
  baseSize = +e.target.value;
  document.getElementById('size-val').textContent = baseSize;
});
document.getElementById('opacity').addEventListener('input', e => {
  opacity = (+e.target.value) / 100;
  document.getElementById('opacity-val').textContent = e.target.value;
});
document.getElementById('use-pressure').addEventListener('change', e => usePressure = e.target.checked);

function requireHost(actionName) {
  if (isHost) return true;
  addChat('', actionName + ' はホストだけが実行できます', true);
  return false;
}
function updateHostUI() {
  const hostOnly = ['add-layer', 'del-layer', 'clear-active', 'apply-size'];
  hostOnly.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = !isHost;
  });
  setStatus(isHost ? (connections.length ? 'ホスト / 接続中(' + connections.length + '人)' : 'ホスト / 部屋作成済み') : '参加者');
}

document.getElementById('add-layer').addEventListener('click', () => {
  if (!requireHost('レイヤー追加')) return;
  const layer = createLayer();
  renderLayerList();
  sendToAll({ type: 'addLayer', id: layer.id, name: layer.name });
});
document.getElementById('del-layer').addEventListener('click', () => {
  if (!requireHost('レイヤー削除')) return;
  if (layers.length <= 1) return;
  const idx = layers.findIndex(l => l.id === activeLayerId);
  if (idx < 0 || layers[idx].name === '背景') {
    addChat('', '背景は削除できません', true); return;
  }
  layers.splice(idx, 1);
  activeLayerId = layers[Math.max(0, idx-1)].id;
  renderLayerList(); composite();
  sendToAll({ type: 'delLayer', id: layers[idx] ? null : null }); // 簡易：削除は後で厳密同期可
});
document.getElementById('clear-active').addEventListener('click', () => {
  if (!requireHost('レイヤー消去')) return;
  clearLayer(activeLayerId, true);
});

function downloadCanvas(mime, ext, quality) {
  // 表示用キャンバスはビュー変換されてるので、論理キャンバスを合成して保存
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = W;
  exportCanvas.height = H;
  const ectx = exportCanvas.getContext('2d');
  ectx.fillStyle = '#ffffff';
  ectx.fillRect(0, 0, W, H);
  for (const l of layers) {
    if (!l.visible) continue;
    ectx.drawImage(l.canvas, 0, 0);
  }
  const name = 'oekaki_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.' + ext;
  exportCanvas.toBlob(blob => {
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, mime, quality);
}
document.getElementById('save-png').addEventListener('click', () => downloadCanvas('image/png', 'png'));
document.getElementById('save-jpg').addEventListener('click', () => downloadCanvas('image/jpeg', 'jpg', 0.92));
document.getElementById('apply-size').addEventListener('click', () => {
  if (!requireHost('キャンバスサイズ変更')) return;
  const w = +document.getElementById('cw').value;
  const h = +document.getElementById('ch').value;
  if (!confirm(`${w}×${h} に変更しますか？`)) return;
  applySize(w, h, true);
});

document.getElementById('use-region').addEventListener('change', e => {
  useRegion = e.target.checked; updateRegionOverlay();
});
document.getElementById('set-region').addEventListener('click', () => {
  settingRegion = true; region = null; updateRegionOverlay();
  addChat('', 'ドラッグで領域を指定', true);
});

// Name
nameInput.value = myName;
nameInput.addEventListener('change', () => {
  myName = nameInput.value.trim().slice(0, 16) || '名無しさん';
  try { localStorage.setItem('oekaki_name', myName); } catch(e) {}
  sendToAll({ type: 'name', name: myName });
});

// Chat
function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  const who = myName || '自分';
  addChat(who, text);
  sendToAll({ type: 'chat', name: who, from: myPeerId.slice(0,6), text });
  input.value = '';
}
document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

// View controls
document.getElementById('zoom-in').onclick = () => { view.scale = Math.min(8, view.scale * 1.25); applyView(); };
document.getElementById('zoom-out').onclick = () => { view.scale = Math.max(0.15, view.scale / 1.25); applyView(); };
document.getElementById('rotate-ccw').onclick = () => { view.rot -= Math.PI / 12; applyView(); };
document.getElementById('rotate-cw').onclick = () => { view.rot += Math.PI / 12; applyView(); };
document.getElementById('view-reset').onclick = () => {
  view = { x: 0, y: 0, scale: 1, rot: 0 }; applyView();
};

// Floating panel drag
document.querySelectorAll('.panel').forEach(panel => {
  const header = panel.querySelector('.panel-header');
  let drag = null;
  header.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    drag = { ox: e.clientX - panel.offsetLeft, oy: e.clientY - panel.offsetTop };
    header.setPointerCapture(e.pointerId);
  });
  header.addEventListener('pointermove', e => {
    if (!drag) return;
    panel.style.left = (e.clientX - drag.ox) + 'px';
    panel.style.top = (e.clientY - drag.oy) + 'px';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
  });
  header.addEventListener('pointerup', () => { drag = null; });
});

// ===================== Pointer / Drawing =====================
function getPos(e) {
  const p = screenToCanvas(e.clientX, e.clientY);
  return {
    x: p.x, y: p.y,
    pressure: (e.pressure > 0 ? e.pressure : 0.5)
  };
}

function onPointerDown(e) {
  if (e.button === 1 || (e.button === 0 && spaceDown)) { // middle or space+left = pan
    isPanning = true;
    panStart = { x: e.clientX - view.x, y: e.clientY - view.y };
    viewport.style.cursor = 'grabbing';
    e.preventDefault();
    return;
  }
  if (e.button === 0 && e.altKey) {
    isRotating = true;
    panStart = { x: e.clientX, y: e.clientY, rot: view.rot };
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  e.preventDefault();
  display.setPointerCapture(e.pointerId);
  const pos = getPos(e);

  if (tool === 'eyedropper') {
    const pixel = dctx.getImageData(Math.floor(pos.x), Math.floor(pos.y), 1, 1).data;
    const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(v => v.toString(16).padStart(2,'0')).join('');
    setColorFromHex(hex);
    return;
  }

  if (settingRegion) {
    regionStart = { x: pos.x, y: pos.y };
    return;
  }
  if (!inRegion(pos.x, pos.y)) return;
  isDrawing = true;
  lastX = pos.x; lastY = pos.y;
}

function onPointerMove(e) {
  if (isPanning && panStart) {
    view.x = e.clientX - panStart.x;
    view.y = e.clientY - panStart.y;
    applyView();
    return;
  }
  if (isRotating && panStart) {
    const dx = e.clientX - panStart.x;
    view.rot = panStart.rot + dx * 0.01;
    applyView();
    return;
  }

  const pos = getPos(e);
  if (settingRegion && regionStart) {
    region = {
      x: Math.min(regionStart.x, pos.x),
      y: Math.min(regionStart.y, pos.y),
      w: Math.abs(pos.x - regionStart.x),
      h: Math.abs(pos.y - regionStart.y)
    };
    updateRegionOverlay();
    return;
  }
  if (!isDrawing) return;
  if (!inRegion(pos.x, pos.y)) return;

  let size = baseSize;
  if (usePressure) size = Math.max(1, baseSize * (0.2 + pos.pressure * 0.8));

  drawStroke(lastX, lastY, pos.x, pos.y, {
    color, size, tool, layerId: activeLayerId, pressure: pos.pressure, opacity
  }, true);
  lastX = pos.x; lastY = pos.y;
}

function onPointerUp(e) {
  if (isPanning) { isPanning = false; viewport.style.cursor = ''; return; }
  if (isRotating) { isRotating = false; return; }
  if (settingRegion && regionStart) {
    settingRegion = false; regionStart = null;
    if (region && region.w > 4 && region.h > 4) {
      useRegion = true;
      document.getElementById('use-region').checked = true;
      addChat('', `領域設定 ${Math.round(region.w)}×${Math.round(region.h)}`, true);
    } else region = null;
    updateRegionOverlay();
    return;
  }
  isDrawing = false;
}

viewport.addEventListener('pointerdown', onPointerDown);
viewport.addEventListener('pointermove', onPointerMove);
viewport.addEventListener('pointerup', onPointerUp);
viewport.addEventListener('pointercancel', onPointerUp);

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  view.scale = Math.min(8, Math.max(0.12, view.scale * factor));
  applyView();
}, { passive: false });

window.addEventListener('keydown', e => {
  // ignore when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.code === 'Space' && !e.repeat) { spaceDown = true; e.preventDefault(); }

  // size
  if (e.key === '[') {
    baseSize = Math.max(1, baseSize - 2);
    document.getElementById('size').value = baseSize;
    document.getElementById('size-val').textContent = baseSize;
  }
  if (e.key === ']') {
    baseSize = Math.min(80, baseSize + 2);
    document.getElementById('size').value = baseSize;
    document.getElementById('size-val').textContent = baseSize;
  }
  // opacity
  if (e.key === 'o' || e.key === 'O') {
    opacity = Math.max(0.05, opacity - 0.05);
    document.getElementById('opacity').value = Math.round(opacity * 100);
    document.getElementById('opacity-val').textContent = Math.round(opacity * 100);
  }
  if (e.key === 'p' || e.key === 'P') {
    opacity = Math.min(1, opacity + 0.05);
    document.getElementById('opacity').value = Math.round(opacity * 100);
    document.getElementById('opacity-val').textContent = Math.round(opacity * 100);
  }
  // tools
  if (e.key === 'b' || e.key === 'B') document.querySelector('[data-tool="pen"]')?.click();
  if (e.key === 't' || e.key === 'T') document.querySelector('[data-tool="thick"]')?.click();
  if (e.key === 'w' || e.key === 'W') document.querySelector('[data-tool="watercolor"]')?.click();
  if (e.key === 'm' || e.key === 'M') document.querySelector('[data-tool="marker"]')?.click();
  if (e.key === 'e' || e.key === 'E') document.querySelector('[data-tool="eraser"]')?.click();
  if (e.key === 'i' || e.key === 'I') document.querySelector('[data-tool="eyedropper"]')?.click();
  // view
  if (e.key === '+' || e.key === '=') { view.scale = Math.min(8, view.scale * 1.2); applyView(); }
  if (e.key === '-' || e.key === '_') { view.scale = Math.max(0.12, view.scale / 1.2); applyView(); }
  if (e.key === 'r' || e.key === 'R') { view.rot -= Math.PI / 12; applyView(); }
  if (e.key === 'f' || e.key === 'F') { view.rot += Math.PI / 12; applyView(); }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') spaceDown = false;
});

// ===================== Boot =====================
function generateShortId() {
  // 読みやすい8文字（数字 + 大文字英字、紛らわしい文字除外）
  const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  let id = '';
  for (let i = 0; i < 8; i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

function startPeer(customId) {
  if (peer) {
    try { peer.destroy(); } catch(e) {}
  }
  peer = new Peer(customId, { debug: 1 });

  peer.on('open', id => {
    myPeerId = id;
    myIdEl.textContent = id;
    updateHostUI();
    addChat('', '部屋ID: ' + id, true);
  });

  peer.on('connection', conn => {
    setupConnection(conn);
    updateHostUI();
  });

  peer.on('error', err => {
    if (err.type === 'unavailable-id') {
      // IDが既に使われてたら別の短いIDで再試行
      const newId = generateShortId();
      addChat('', 'IDが使われていたので別のIDに変更: ' + newId, true);
      startPeer(newId);
    } else {
      setStatus('エラー: ' + err.type);
      addChat('', '接続エラー: ' + err.type, true);
    }
  });
}

// 最初は短いIDで起動
startPeer(generateShortId());

document.getElementById('join-btn').addEventListener('click', () => {
  const target = document.getElementById('join-id').value.trim().toUpperCase();
  if (!target) return;
  isHost = false;
  updateHostUI();
  const conn = peer.connect(target, { reliable: true });
  setupConnection(conn);
  setStatus('接続試行中...');
});

display.width = W; display.height = H;
initLayers();
applyView();
updateHostUI();
addChat('', 'v3 準備完了。名前を設定してIDを共有してください。ホストだけがレイヤー操作できます。', true);
</script>
